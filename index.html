<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>TREND | نظام إدارة المتجر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root{--bg:#f4f7f6;--sidebar:#111827;--sidebar-hover:#1f2937;--primary:#10b981;--text:#374151;--white:#fff;--border:#e5e7eb;}
        *{box-sizing:border-box;font-family:'Cairo',sans-serif;margin:0;padding:0;}
        body{background:var(--bg);display:flex;height:100vh;overflow:hidden;color:var(--text);}
        
        #login-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--sidebar);display:flex;justify-content:center;align-items:center;z-index:9999;flex-direction:column;}
        .login-box{background:var(--white);padding:40px;border-radius:12px;text-align:center;width:350px;}
        .login-box h2{color:var(--sidebar);margin-bottom:20px;}
        .login-box input{width:100%;padding:12px;margin-bottom:15px;border:1px solid var(--border);border-radius:8px;font-family:'Cairo';}
        .login-box button{background:var(--primary);color:white;border:none;padding:12px;width:100%;border-radius:8px;cursor:pointer;font-weight:bold;}
        
        .sidebar{width:260px;background:var(--sidebar);color:#9ca3af;display:flex;flex-direction:column;transition:.3s;z-index:100;}
        .sidebar .logo{padding:25px 20px;text-align:center;font-size:28px;font-weight:700;color:var(--white);border-bottom:1px solid #374151;letter-spacing:2px;}
        .sidebar button{background:none;border:none;color:#9ca3af;padding:18px 24px;text-align:right;font-size:16px;cursor:pointer;transition:.2s;width:100%;font-weight:600;display:flex;align-items:center;gap:12px;}
        .sidebar button:hover,.sidebar button.active{background:var(--sidebar-hover);color:var(--primary);border-right:4px solid var(--primary);}
        
        .main-content{flex:1;padding:30px;overflow-y:auto;display:flex;flex-direction:column;gap:25px;}
        .page{display:none;animation:fadeIn .3s ease-in-out;}
        .page.active{display:block;}
        
        .card{background:var(--white);padding:25px;border-radius:12px;box-shadow:0 4px 6px -1px rgba(0,0,0,.05);margin-bottom:25px;border:1px solid var(--border);}
        .card h3{margin-bottom:20px;color:var(--sidebar);font-size:18px;border-bottom:2px solid var(--border);padding-bottom:15px;}
        .form-group{margin-bottom:18px;}
        label{display:block;margin-bottom:8px;font-weight:600;font-size:14px;color:#4b5563;}
        input{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;transition:.2s;font-family:'Cairo';}
        input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(16,185,129,.2);}
        button.btn{background:var(--primary);color:var(--white);border:none;padding:12px 20px;border-radius:8px;cursor:pointer;font-size:15px;font-weight:700;width:100%;transition:.2s;}
        button.btn:hover{background:#059669;}
        
        .pos-layout{display:flex;gap:25px;height:calc(100vh - 60px);}
        .pos-products{flex:2;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px;align-content:start;}
        .product-card{background:var(--white);padding:20px;border-radius:12px;text-align:center;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.04);transition:.2s;border:1px solid var(--border);}
        .product-card:hover{transform:translateY(-5px);box-shadow:0 10px 15px -3px rgba(0,0,0,.1);border-color:var(--primary);}
        .product-card h4{margin-bottom:15px;color:var(--sidebar);font-size:16px;}
        .product-card .price{color:var(--primary);font-weight:700;font-size:20px;}
        
        .pos-cart{flex:1;background:var(--white);border-radius:12px;display:flex;flex-direction:column;box-shadow:0 4px 6px -1px rgba(0,0,0,.05);border:1px solid var(--border);}
        .pos-cart h3{padding:20px;background:var(--sidebar);color:var(--white);margin:0;border-radius:12px 12px 0 0;text-align:center;font-size:18px;}
        .cart-items{flex:1;overflow-y:auto;padding:20px;}
        .cart-item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding:15px 0;}
        .cart-item-info h5{margin:0 0 5px;font-size:15px;color:var(--sidebar);}
        .cart-item-info span{font-size:13px;color:#6b7280;}
        .cart-controls{display:flex;align-items:center;gap:12px;background:#f3f4f6;padding:5px 10px;border-radius:8px;}
        .cart-controls button{padding:4px 10px;border:none;background:var(--white);border-radius:4px;cursor:pointer;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.1);}
        .cart-footer{padding:20px;background:#f9fafb;border-radius:0 0 12px 12px;border-top:1px solid var(--border);}
        .total-row{display:flex;justify-content:space-between;font-size:24px;font-weight:700;margin-bottom:20px;color:var(--sidebar);}
        
        .message{padding:15px;text-align:center;border-radius:8px;margin-bottom:20px;display:none;font-weight:700;}
        .message.success{display:block;background:#d1fae5;color:#065f46;border:1px solid #10b981;}
        .message.error{display:block;background:#fee2e2;color:#991b1b;border:1px solid #ef4444;}
        
        .menu-toggle{display:none;background:var(--sidebar);color:white;border:none;padding:15px;font-size:20px;cursor:pointer;width:100%;text-align:right;}
        
        @media print {
            body * { visibility: hidden; }
            #receipt-area, #receipt-area * { visibility: visible; }
            #receipt-area { position: absolute; left: 0; top: 0; width: 80mm; padding: 5px; font-size: 12px; text-align: center; }
            .no-print { display: none; }
        }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h2>تسجيل الدخول - TREND</h2>
            <input type="text" id="login-user" placeholder="اسم المستخدم">
            <input type="password" id="login-pass" placeholder="كلمة المرور">
            <button onclick="login()">دخول</button>
            <p id="login-err" style="color:red; margin-top:10px; display:none;">بيانات خطأ!</p>
        </div>
    </div>

    <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('show')">☰ القائمة</button>
    
    <div class="sidebar">
        <div class="logo">TREND</div>
        <button class="active" onclick="switchPage('pos')">🛒 نقطة البيع (POS)</button>
        <button onclick="switchPage('inventory')">📦 المخزن والأصناف</button>
        <button id="btn-reports" onclick="switchPage('reports')" style="display:none;">📊 التقارير والأرباح</button>
        <button onclick="logout()" style="margin-top:auto; color:#ef4444;">🚪 تسجيل خروج</button>
    </div>
    
    <div class="main-content">
        <div id="message-box" class="message"></div>
        
        <div id="page-pos" class="page active">
            <div style="margin-bottom:15px; display:flex; gap:10px;">
                <input type="text" id="pos-search" placeholder="مسح الباركود أو بحث بالاسم (Enter)" style="flex:1; font-size:16px;" onkeydown="if(event.key==='Enter') searchProduct()">
                <button class="btn" style="width:150px;" onclick="searchProduct()">بحث / إضافة</button>
            </div>
            <div class="pos-layout">
                <div class="pos-products" id="pos-products-list"></div>
                <div class="pos-cart">
                    <h3>سلة المشتريات</h3>
                    <div class="cart-items" id="cart-items"><p style="text-align:center;color:#9ca3af;margin-top:20px;">السلة فارغة</p></div>
                    <div class="cart-footer">
                        <div class="total-row"><span>الإجمالي:</span><span id="cart-total">0.00 ج.م</span></div>
                        <button class="btn" onclick="checkout()">إتمام البيع والطباعة</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="page-inventory" class="page">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:25px;margin-bottom:25px;">
                <div class="card">
                    <h3>➕ إضافة صنف جديد</h3>
                    <div class="form-group"><label>اسم الصنف</label><input type="text" id="p_name"></div>
                    <div class="form-group"><label>الباركود</label><input type="text" id="p_barcode"></div>
                    <div style="display:flex;gap:15px;">
                        <div class="form-group" style="flex:1;"><label>سعر الشراء</label><input type="number" id="p_purchase" value="0"></div>
                        <div class="form-group" style="flex:1;"><label>سعر البيع</label><input type="number" id="p_sale" value="0"></div>
                    </div>
                    <button class="btn" onclick="addProduct()">حفظ الصنف</button>
                </div>
                <div class="card">
                    <h3>🏬 إضافة مخزن جديد</h3>
                    <div class="form-group"><label>اسم المخزن</label><input type="text" id="w_name"></div>
                    <div class="form-group"><label>كود المخزن</label><input type="text" id="w_code"></div>
                    <button class="btn" onclick="addWarehouse()">حفظ المخزن</button>
                </div>
            </div>
            <div class="card">
                <h3>📋 قائمة الأصناف</h3>
                <table style="width:100%; border-collapse:collapse; text-align:right;">
                    <thead><tr style="background:#f9fafb;"><th>#</th><th>الصنف</th><th>الباركود</th><th>شراء</th><th>بيع</th><th>الرصيد</th><th>حذف</th></tr></thead>
                    <tbody id="inventory-table"></tbody>
                </table>
            </div>
        </div>

        <div id="page-reports" class="page">
            <div class="card"><h3>📊 تقرير الأرباح</h3><p>هنا تظهر تقارير الأرباح والمبيعات (للمدير فقط).</p></div>
        </div>
    </div>

    <div id="receipt-area" style="display:none;"></div>
        <script>
        const SUPABASE_URL='https://pvalxfezntojktvfsoqj.supabase.co';
        const SUPABASE_KEY='sb_publishable_nKy49NJsu0pfProS0o38fA_4s2LvcuV';
        const {createClient}=supabase;
        const db=createClient(SUPABASE_URL,SUPABASE_KEY);
        
        let allProducts=[], cart=[], defaultWarehouseId=null;
        let isAdmin = false; 

        function login() {
            const user = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;
            const err = document.getElementById('login-err');
            
            if(user === 'amr' && pass === 'amr1234') {
                isAdmin = true;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('btn-reports').style.display = 'flex';
                err.style.display = 'none';
                init();
            } else if (user === 'cashier' && pass === '123') {
                isAdmin = false;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('btn-reports').style.display = 'none';
                err.style.display = 'none';
                init();
            } else {
                err.style.display = 'block';
            }
        }

        function logout() { location.reload(); }

        function requireAdminAuth(callback) {
            if(isAdmin) {
                callback();
            } else {
                const pass = prompt("هذا الإجراء يتطلب صلاحيات المدير. أدخل كلمة المرور:");
                if(pass === 'amr1234') {
                    callback();
                } else if(pass !== null) {
                    showMessage('كلمة المرور خطأ!', true);
                }
            }
        }

        function switchPage(e){
            document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
            document.querySelectorAll('.sidebar button').forEach(el=>el.classList.remove('active'));
            document.getElementById('page-'+e).classList.add('active');
            if(event) event.target.classList.add('active');
            if(window.innerWidth<=768) document.querySelector('.sidebar').classList.remove('show');
        }

        function showMessage(e,t=!1){
            const n=document.getElementById('message-box');
            n.className='message '+(t?'error':'success');
            n.innerText=e;
            setTimeout(()=>{n.style.display='none'},3e3);
        }

        async function init(){
            try{
                const{data:e,error:t}=await db.from('warehouses').select('id').limit(1);
                if(t) throw t;
                if(e && e.length>0) defaultWarehouseId=e[0].id;
                await loadProducts();
            } catch(e){ showMessage('خطأ في الاتصال: '+e.message,!0); }
        }

        async function loadProducts(){
            try{
                const{data:e,error:t}=await db.from('products').select('*').order('id',{ascending:!1});
                if(t) throw t;
                allProducts=e||[];
                renderInventoryTable();
                renderPOSProducts();
            } catch(e){ showMessage('خطأ في جلب الأصناف: '+e.message,!0); }
        }

        function searchProduct() {
            const query = document.getElementById('pos-search').value.trim().toLowerCase();
            if(!query) return;
            const product = allProducts.find(p => (p.barcode && p.barcode.toLowerCase() === query) || (p.name && p.name.toLowerCase().includes(query)));
            if(product) {
                addToCart(product.id);
                document.getElementById('pos-search').value = '';
            } else {
                showMessage('الصنف غير موجود!', true);
                document.getElementById('pos-search').value = '';
            }
        }

        async function addProduct(){
            const e=document.getElementById('p_name').value;
            if(!e) return showMessage('ادخل اسم الصنف',!0);
            try{
                const{error:t}=await db.from('products').insert([{
                    name:e,
                    barcode:document.getElementById('p_barcode').value||null,
                    default_purchase_price:parseFloat(document.getElementById('p_purchase').value)||0,
                    default_sale_price:parseFloat(document.getElementById('p_sale').value)||0
                }]);
                if(t) throw t;
                showMessage('تم إضافة الصنف بنجاح!');
                document.getElementById('p_name').value='';
                document.getElementById('p_barcode').value='';
                loadProducts();
            } catch(e){ showMessage('خطأ: '+e.message,!0); }
        }

        async function addWarehouse(){
            const e=document.getElementById('w_name').value;
            if(!e) return showMessage('ادخل اسم المخزن',!0);
            try{
                const{error:t}=await db.from('warehouses').insert([{name:e,code:document.getElementById('w_code').value||null}]);
                if(t) throw t;
                showMessage('تم إضافة المخزن بنجاح!');
                document.getElementById('w_name').value='';
                document.getElementById('w_code').value='';
            } catch(e){ showMessage('خطأ: '+e.message,!0); }
        }

        async function renderInventoryTable(){
            const tbody=document.getElementById('inventory-table');
            if(allProducts.length===0) {
                tbody.innerHTML='<tr><td colspan="7" style="text-align:center;">لا يوجد أصناف</td></tr>';
                return;
            }
            tbody.innerHTML='';
            for(let p of allProducts){
                const{data:stock}=await db.from('product_stock').select('quantity').eq('product_id',p.id);
                const qty=stock?stock.reduce((s,i)=>s+Number(i.quantity),0):0;
                tbody.innerHTML+=`
                    <tr>
                        <td>${p.id}</td>
                        <td><strong>${p.name}</strong></td>
                        <td>${p.barcode||'-'}</td>
                        <td>${p.default_purchase_price} ج.م</td>
                        <td>${p.default_sale_price} ج.م</td>
                        <td>${qty}</td>
                        <td>
                            <button onclick="requireAdminAuth(() => deleteProduct(${p.id}))" style="background:#ef4444; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">حذف</button>
                        </td>
                    </tr>`;
            }
        }

        async function deleteProduct(id) {
            if(!confirm('هل أنت متأكد من حذف هذا الصنف؟')) return;
            try {
                await db.from('products').delete().eq('id', id);
                showMessage('تم حذف الصنف');
                loadProducts();
            } catch(e) { showMessage('خطأ في الحذف: '+e.message, true); }
        }

        function renderPOSProducts(){
            const container=document.getElementById('pos-products-list');
            container.innerHTML='';
            allProducts.forEach(p=>{
                container.innerHTML+=`
                    <div class="product-card" onclick="addToCart(${p.id})">
                        <h4>${p.name}</h4>
                        <div class="price">${p.default_sale_price} ج.م</div>
                    </div>`;
            });
        }

        function addToCart(id){
            const p=allProducts.find(x=>x.id===id);
            const existing=cart.find(x=>x.id===id);
            if(existing) existing.qty++;
            else cart.push({...p, qty:1});
            renderCart();
        }

        function renderCart(){
            const container=document.getElementById('cart-items');
            const totalEl=document.getElementById('cart-total');
            if(cart.length===0) {
                container.innerHTML='<p style="text-align:center;color:#9ca3af;margin-top:20px;">السلة فارغة</p>';
                totalEl.innerText='0.00 ج.م';
                return;
            }
            container.innerHTML='';
            let total=0;
            cart.forEach((item,index)=>{
                total+=(item.default_sale_price*item.qty);
                container.innerHTML+=`
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h5>${item.name}</h5>
                            <span>${item.default_sale_price} ج.م × ${item.qty}</span>
                        </div>
                        <div class="cart-controls">
                            <button onclick="updateQty(${index},-1)">-</button>
                            <span>${item.qty}</span>
                            <button onclick="updateQty(${index},1)">+</button>
                        </div>
                    </div>`;
            });
            totalEl.innerText=total.toFixed(2)+' ج.م';
        }

        function updateQty(index,change){
            cart[index].qty+=change;
            if(cart[index].qty<=0) cart.splice(index,1);
            renderCart();
        }

        async function checkout(){
            if(cart.length===0) return showMessage('السلة فارغة',!0);
            if(!defaultWarehouseId) return showMessage('يجب إضافة مخزن أولاً',!0);
            try{
                const total=cart.reduce((sum,item)=>sum+(item.default_sale_price*item.qty),0);
                for(let item of cart){
                    const{data:stock}=await db.from('product_stock').select('*').eq('product_id',item.id).eq('warehouse_id',defaultWarehouseId).single();
                    if(stock){
                        await db.from('product_stock').update({quantity:stock.quantity-item.qty}).eq('id',stock.id);
                    } else {
                        await db.from('product_stock').insert([{product_id:item.id,warehouse_id:defaultWarehouseId,quantity:-item.qty}]);
                    }
                }
                printReceipt(total);
                showMessage(`تم البيع بنجاح! الإجمالي: ${total.toFixed(2)} ج.م`);
                cart=[];
                renderCart();
                loadProducts();
            } catch(e){ showMessage('خطأ في البيع: '+e.message,!0); }
        }

        function printReceipt(total) {
            const receipt = document.getElementById('receipt-area');
            let html = `
                <h2 style="margin:0;">TREND</h2>
                <p style="margin:5px 0;">نظام إدارة المتجر</p>
                <hr style="border-top:1px dashed #000;">
                <table style="width:100%; text-align:right; font-size:12px;">
            `;
            cart.forEach(item => {
                html += `<tr><td>${item.name}</td><td>${item.qty} × ${item.default_sale_price}</td></tr>`;
            });
            html += `
                </table>
                <hr style="border-top:1px dashed #000;">
                <h3 style="margin:5px 0;">الإجمالي: ${total.toFixed(2)} ج.م</h3>
                <p style="margin-top:10px; font-size:10px;">شكراً لزيارتكم!</p>
            `;
            receipt.innerHTML = html;
            receipt.style.display = 'block';
            setTimeout(() => {
                window.print();
                receipt.style.display = 'none';
            }, 500);
        }

        window.onload = function() {
            document.getElementById('login-screen').style.display = 'flex';
        };
    </script>
</body>
</html>
